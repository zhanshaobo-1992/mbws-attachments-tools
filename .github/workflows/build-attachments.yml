name: build-attachments

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ziplist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Build ziplist packages
        run: |
          chmod +x scripts/build-ziplist.sh
          ./scripts/build-ziplist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ziplist-dist
          path: dist/ziplist/*.{tar.gz,zip}

  # unzip packaging needs macOS host binary; run package-unzip locally or extend with
  # cached binaries committed under vendor/ (not enabled by default).
